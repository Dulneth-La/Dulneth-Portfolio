services:
  - type: web
    name: dulneth-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: dulneth-portfolio-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dulneth-portfolio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dulneth-portfolio-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: dulneth-portfolio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dulneth-portfolio-db
          property: port
      - key: CONTACT_EMAIL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: dulneth-portfolio-db
    plan: free
    databaseName: dulneth_portfolio
