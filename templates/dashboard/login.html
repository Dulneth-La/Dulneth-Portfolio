<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="dash-login-body">

    <div class="dash-login-wrapper">
        <div class="dash-login-card">
            <div class="dash-login-header">
                <a href="/" class="dash-login-logo">Dulneth<span>.</span></a>
                <h1>Dashboard</h1>
                <p>Sign in to manage your portfolio</p>
            </div>

            {% if error %}
                <div class="dash-alert dash-alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="dash-login-form">
                {% csrf_token %}
                <div class="dash-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="dash-input" placeholder="Enter username" required autofocus>
                </div>
                <div class="dash-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="dash-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="dash-btn dash-btn-primary dash-btn-full">Sign In</button>
            </form>

            <div class="dash-login-footer">
                <a href="/">Back to portfolio</a>
            </div>
        </div>
    </div>

</body>
</html>
