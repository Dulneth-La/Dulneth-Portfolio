<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block dash_title %}Dashboard{% endblock %} | Dulneth Lahiru</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="dash-body">

    <div class="dash-layout">

        <aside class="dash-sidebar">
            <div class="dash-sidebar-header">
                <a href="/" class="dash-login-logo">Dulneth<span>.</span></a>
                <span class="dash-sidebar-badge">Admin</span>
            </div>

            <nav class="dash-nav">
                <a href="{% url 'dashboard_index' %}" class="dash-nav-item {% if request.resolver_match.url_name == 'dashboard_index' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Overview
                </a>
                <a href="{% url 'dashboard_project_list' %}" class="dash-nav-item {% if 'project' in request.path %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Projects
                </a>
                <a href="{% url 'dashboard_blog_list' %}" class="dash-nav-item {% if 'blog' in request.path %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    Blog Posts
                </a>
            </nav>

            <div class="dash-sidebar-footer">
                <a href="/" class="dash-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    View Site
                </a>
                <a href="{% url 'dashboard_logout' %}" class="dash-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </div>
        </aside>

        <main class="dash-main">
            <div class="dash-topbar">
                <h2 class="dash-page-title">{% block dash_heading %}Overview{% endblock %}</h2>
                <div class="dash-topbar-right">
                    <span class="dash-user">{{ request.user.username }}</span>
                </div>
            </div>

            <div class="dash-content">
                {% block dash_content %}{% endblock %}
            </div>
        </main>

    </div>

</body>
</html>
