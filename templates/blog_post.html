{% extends 'base.html' %}

{% block title %}
{{ post.title }} | Dulneth Lahiru
{% endblock %}

{% block content %}

<article class="blog-article">

    <div class="blog-article-header">
        <a href="/blog/" class="blog-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Blog
        </a>

        <div class="blog-article-meta">
            <span class="blog-category blog-category-{{ post.category|lower }}">{{ post.category }}</span>
            {% if post.difficulty %}
                <span class="blog-difficulty blog-diff-{{ post.difficulty|lower }}">{{ post.difficulty }}</span>
            {% endif %}
            <span class="blog-article-date">{{ post.date_published|date:"M d, Y" }}</span>
        </div>

        <h1 class="blog-article-title">{{ post.title }}</h1>
    </div>

    <div class="blog-article-content">
        {{ content_html }}
    </div>

</article>

{% endblock %}
